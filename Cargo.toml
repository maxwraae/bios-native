[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
bios-core = { path = "crates/bios-core" }
bios-layout = { path = "crates/bios-layout" }
bios-mcp = { path = "crates/bios-mcp" }
bios-engine = { path = "crates/bios-engine" }
bios-project = { path = "crates/bios-project" }
bios-sync = { path = "crates/bios-sync" }
bios-ui = { path = "crates/bios-ui" }
bios-update = { path = "crates/bios-update" }
# One rev for every craft-libs crate; mixed revs produce duplicate types.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0", features = ["egui"] }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
# Checking for, downloading and installing Bios's own releases from GitHub (MIT OR Apache-2.0).
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0", features = ["egui"] }
craft-xtask = { git = "https://github.com/storytold/craft-libs", rev = "af9985523a079c9e25c638003dbd9aa09fa4d254", version = "=0.1.0" }
egui = { version = "0.37", default-features = false }
# Reading and flattening the Lucide icons' SVG paths (Apache-2.0 OR MIT).
kurbo = "0.13"
eframe = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
# Moving a deleted project to the system Trash (MIT). Without its default `jiff` feature, whose
# licence expression is not all on the allowlist.
trash = { version = "5.4", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }
# Blocking HTTP for bios-sync. TLS is the operating system's own, with its own root certificates:
# the features that bundle root certificates pull in a licence that is not on the allowlist.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# The never-crash lints (unwrap, expect, panic, ...) are `deny` attributes at each crate root, so
# that tests may still use them (clippy.toml).
[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimised and carry no debug info: the window is usable in a dev build and the
# target folder stays small.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Bios draws with ArtCraft's egui and winit forks; a [patch] does not propagate from a dependency.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
