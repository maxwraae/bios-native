[package]
name = "bios-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["mapper"]
# Bios's own read mapper. Without it the read-mapping commands are still there and say that read
# mapping is not in this build.
mapper = ["dep:bios-mapper"]

[dependencies]
bios-core = { workspace = true }
bios-mapper = { workspace = true, optional = true }
bios-project = { workspace = true }
bios-sync = { workspace = true }
chrono = { workspace = true }
# Gzipping the alignments a verification keeps (MIT OR Apache-2.0, already in the tree).
flate2 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
flate2 = "1"
